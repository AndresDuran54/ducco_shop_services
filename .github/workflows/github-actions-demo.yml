name: Deploy to AKS

run-name: ${{ github.actor }}
on: 
  push:
    branches: [ main-gh-actions ]
jobs:
  prepare_env:
    runs-on: [ self-hosted ]
    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Compile microservice
        run: docker build -t ducco_products ./@deploy/ducco_products/.

      - name: User
        run: id
